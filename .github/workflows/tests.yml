name: tests

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned seqtree candidate and vdjmatch test deps
        run: |
          python -m pip install --upgrade pip
          # Candidate prerequisite until seqtree 1.0.3 is published; remove after release.
          pip install "seqtree @ git+https://github.com/antigenomics/seqtree.git@6aab661b2b51280fbf7c80a7da0c7b6493e90ba9"
          pip install -e ".[test,bench]"
      - name: Import must not need the precursor extra
        run: python -c "import vdjmatch; print(vdjmatch.__version__)"
      - name: Install the precursor extra (vdjtools carries the recombination model)
        run: pip install -e ".[precursor]"
      - name: Run unit tests
        run: pytest -m "not slow" -ra
