name: tests

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install released dependencies and vdjmatch test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,bench]"
      - name: Import must not need the precursor extra
        run: python -c "import vdjmatch; print(vdjmatch.__version__)"
      - name: Install the precursor extra (vdjtools carries the recombination model)
        run: pip install -e ".[precursor]"
      - name: Run unit tests
        run: pytest -m "not slow" -ra
      - name: Verify cohort CLI/library parallelism and process-tree memory
        run: pytest tests/test_annotation_resources.py -q
      - name: Verify frozen alignment against its pinned native implementation
        run: |
          pip install --no-deps "seqtree @ git+https://github.com/antigenomics/seqtree.git@8cfb2f0e8cd29330a87bad0ccf1644ad04fd7cef"
          pytest tests/unit/test_classical.py tests/unit/test_fixed_scope.py -q
