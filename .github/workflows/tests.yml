name: tests

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install released dependencies and vdjmatch test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,bench,diagnostics]"
      - name: Import must not need the precursor extra
        run: python -c "import vdjmatch; print(vdjmatch.__version__)"
      - name: Install the precursor extra (vdjtools carries the recombination model)
        run: pip install -e ".[precursor]"
      - name: Verify released native and ingestion capabilities
        run: |
          python - <<'PYTHON'
          from inspect import signature
          from seqtree import Index, _core
          from vdjtools.io.convert import read_mitcr
          assert _core.exact_exclusion_hits_only
          for name in ('alignment_max_batch', 'search_batch_consume', 'search_paired_batch_consume'):
              assert callable(getattr(Index, name, None)), name
          assert 'skip_empty' in Index.search_paired_batch_consume.__doc__
          assert 'collapse' in signature(read_mitcr).parameters
          PYTHON
          pytest tests/unit/test_classical.py tests/unit/test_fixed_scope.py -q
      - name: Run unit tests
        run: pytest -m "not slow" -ra
      - name: Verify cohort CLI/library parallelism and process-tree memory
        run: pytest tests/test_annotation_resources.py -q
