name: Native Windows end-to-end

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      dependency_ref:
        description: Source dependency branch or tag (master for normal verification)
        default: master
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/checkout@v4
        with:
          repository: antigenomics/seqtree
          ref: ${{ inputs.dependency_ref || 'master' }}
          path: .upstream/seqtree
      - uses: actions/checkout@v4
        with:
          repository: antigenomics/arda
          ref: ${{ inputs.dependency_ref || 'master' }}
          path: .upstream/arda
      - uses: actions/checkout@v4
        with:
          repository: antigenomics/vdjtools
          ref: ${{ inputs.dependency_ref || 'master' }}
          path: .upstream/vdjtools
      - name: Build source dependencies and package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install ./.upstream/seqtree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install ./.upstream/arda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install ./.upstream/vdjtools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install ".[test]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native search and real annotation
        shell: pwsh
        run: |
          python -c "import vdjtools, pytest; raise SystemExit(pytest.main(['tests/unit/test_api_runtime.py::test_public_default_uses_allocation_and_preserves_serial_calls', '-q']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/labeled_references.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
