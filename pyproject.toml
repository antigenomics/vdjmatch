[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vdjmatch"
version = "1.1.0"
description = "Fast, control-calibrated annotation of T-cell receptor antigen specificity"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ISALGO laboratory", email = "mikhail.shugay@gmail.com" }]
keywords = ["TCR", "VDJdb", "antigen-specificity", "immunology", "AIRR", "repertoire", "E-value"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "seqtree>=1.3.2",
    "vdjtools>=5.5.0",    # format ingestion, allocated CPU-budget validation and native Pgen
    "polars>=1.41.2,<2",
    "scipy>=1.9",       # exact finite-control bounds and binomial tails for paired punctures
    "threadpoolctl",    # enforce BLAS limits for evidence combination
]

[project.optional-dependencies]
cli = ["tqdm"]                    # optional progress bars for precursor/legacy scan workflows
# Optional numerical analysis dependencies for the precursor command.
precursor = ["numpy"]
test = ["pytest>=7.4", "hypothesis", "biopython>=1.84"]
bench = ["psutil", "huggingface_hub", "matplotlib", "seaborn", "scikit-learn", "rapidfuzz"]  # HF benchmark; matplotlib/seaborn: boxplots; scikit-learn/rapidfuzz: AUC0.1 + clustering internal metrics
control = ["seqtree[control]", "huggingface_hub"]  # TRA/mouse controls beyond bundled human TRB
ndn = ["arda-mapper>=2.38.2"]       # opt-in fixed V/J versus NDN geometry
ods = ["ezodf"]                   # read supplied comparison golden .ods tables in tests
diagnostics = ["leidenalg>=0.11,<0.13"]  # seeded Leiden; Chao/bootstrap reuse vdjtools
# `marimo edit docs/notebooks/precursor_compendium.py` -- the interactive walkthrough of
# prediction against measured naive precursor frequency. matplotlib draws its figures.
notebook = ["marimo", "matplotlib", "huggingface_hub"]
vdjam = ["biopython>=1.84"]       # bench/gen_vdjam.py: BLOSUM62 baseline (mirpy-lib added for V/J trimming model)

[project.scripts]
vdjmatch = "vdjmatch.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/antigenomics/vdjmatch"
Repository = "https://github.com/antigenomics/vdjmatch"
Documentation = "https://antigenomics.github.io/vdjmatch/"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: excluded from the default CI run (`pytest -m 'not slow'`)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vdjmatch"]
# resources/ (vdjam.txt, score_coef.txt, segm_score.txt) live inside the package dir and are
# shipped automatically by hatchling — no force-include needed.

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "examples", "docs/*.rst", "docs/conf.py", "docs/notebooks", "docs/_static", "docs/_templates", "appendix/*.tex", "pyproject.toml", "README.md", "LICENSE*", "setup.sh"]
exclude = ["**/*_local.md", "AGENTS.md", "**/__pycache__", "**/.ipynb_checkpoints"]
